<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin LolosKerja</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
  :root { --bg: #0B0B0C; --s1: #17171A; --s2: #222226; --line: #2E2E33; --fg: #F5F5F6; --mute: #A3A3AB; --red: #FF3B47; --ink: #1A0204; --ok: #3DDC97; --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Plus Jakarta Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 80px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
  h1 { font: 800 30px var(--display); letter-spacing: -.03em; margin: 0; display: flex; align-items: center; gap: 10px; }
  h2 { font: 800 20px var(--display); letter-spacing: -.02em; margin: 0 0 10px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
  .card { background: var(--s1); border-radius: 22px; padding: 18px; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--mute); }
  input, select { font: inherit; color: var(--fg); background: var(--s2); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; }
  input:focus { outline: none; border-color: var(--red); }
  .row { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .row.c3 { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; } .row.c2 { grid-template-columns: 1fr auto; align-items: end; } }
  button { font: 800 14px var(--body); border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; background: var(--red); color: var(--ink); }
  button.ghost { background: var(--s2); color: var(--fg); }
  button.sm { padding: 6px 11px; font-size: 12px; }
  .muted { color: var(--mute); }
  .msg { font-size: 14px; font-weight: 600; }
  .made { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .made pre { margin: 0; white-space: pre-wrap; background: var(--s2); border-radius: 14px; padding: 12px; font: 600 13px/1.55 var(--mono); }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; border-top: 0; }
  td.code { font: 800 14px var(--mono); }
  .pill { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: rgba(61,220,151,.15); color: var(--ok); }
  .pill.off { background: var(--s2); color: var(--mute); }
  .acts { display: flex; gap: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A0204" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Admin kode akses</h1>

  <section class="card" id="login">
    <h2>Masuk</h2>
    <form id="login-form" class="row c2">
      <label for="key">Kunci admin<input id="key" type="password" autocomplete="current-password" required></label>
      <button type="submit">Masuk</button>
    </form>
    <p class="msg" id="login-msg"></p>
  </section>

  <div id="main" hidden>
    <section class="card">
      <h2>Sambungan Scalev</h2>
      <p class="muted" id="sc-status">Memuat…</p>
      <div class="row c2" style="margin-bottom:10px">
        <label for="sc-url">Webhook URL (tempel di Scalev › Settings › Developers › Webhooks)<input id="sc-url" readonly></label>
        <button class="ghost" type="button" id="sc-copy">Salin URL</button>
      </div>
      <p class="muted" style="font-size:13px;margin:0 0 12px">Centang event: <b>order.created</b>, <b>order.updated</b>, <b>payment.received</b>. Arahkan "Post-payment redirect URL" di halaman checkout ke <b id="sc-claim"></b>.</p>
      <form id="sc-form" class="row c2">
        <label for="sc-secret">Signing Secret dari Scalev<input id="sc-secret" type="password" autocomplete="off" placeholder="Tempel di sini, lalu simpan"></label>
        <button type="submit">Simpan</button>
      </form>
      <details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:13px">Varian produk yang dapat kode (lanjutan)</summary>
        <form id="sc-var-form" class="row c2" style="margin-top:8px">
          <label for="sc-variants">variant_unique_id, satu per baris<textarea id="sc-variants" rows="3" style="font:600 13px var(--mono);color:var(--fg);background:var(--s2);border:1.5px solid var(--line);border-radius:12px;padding:10px;width:100%"></textarea></label>
          <button class="ghost" type="submit">Simpan varian</button>
        </form>
      </details>
    </section>

    <section class="card">
      <h2>Buat kode untuk pembeli</h2>
      <form id="make-form" class="row c3">
        <label for="label">Nama pembeli / no. order<input id="label" placeholder="Contoh: Rina · #1042"></label>
        <label for="count">Jumlah kode<input id="count" type="number" min="1" max="100" value="1"></label>
        <label for="max">Maks. HP per kode<input id="max" type="number" min="1" max="5" value="2"></label>
        <button type="submit">Buat kode</button>
      </form>
      <div class="made" id="made"></div>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <h2 style="margin:0">Semua kode</h2>
        <div style="display:flex;gap:8px;align-items:center"><input id="q" placeholder="Cari kode atau nama" style="width:220px"><button class="ghost sm" id="reload" type="button">Muat ulang</button></div>
      </div>
      <p class="muted" id="sum"></p>
      <div class="tbl"><table><thead><tr><th>Kode</th><th>Pembeli</th><th>HP</th><th>Status</th><th>Dibuat</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div>
</div>
<script>
const APP_URL = location.origin + "/";
let KEY = ""; try { KEY = sessionStorage.getItem("lk-admin") || ""; } catch (e) {}
let ALL = [];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (method, body) => {
  const r = await fetch("/api/admin/codes", { method, headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Gagal (${r.status})`);
  return d;
};
const waText = (code, label) => `Halo${label ? " " + label.split("·")[0].trim() : ""}, terima kasih sudah membeli LolosKerja Kit.\n\n1. Buka app: ${APP_URL}\n2. Masukkan kode akses: ${code}\n3. Ketuk "Tambahkan ke layar utama" supaya bisa dibuka seperti app biasa.\n\n1 kode bisa dipakai di 2 HP. Setelah aktif, app bisa dibuka tanpa internet. Selamat latihan!`;
async function copy(txt, btn) { try { await navigator.clipboard.writeText(txt); const o = btn.textContent; btn.textContent = "Tersalin ✓"; setTimeout(() => (btn.textContent = o), 1400); } catch (e) { prompt("Salin teks ini:", txt); } }

async function load() {
  const d = await api("GET");
  ALL = d.codes; draw();
}
function draw() {
  const q = $("#q").value.trim().toLowerCase();
  const list = ALL.filter((c) => !q || c.code.toLowerCase().includes(q) || (c.label || "").toLowerCase().includes(q));
  const used = ALL.filter((c) => c.devices.length).length;
  $("#sum").textContent = `${ALL.length} kode · ${used} sudah dipakai · ${ALL.length - used} belum dipakai`;
  $("#rows").innerHTML = list.map((c) => `<tr>
    <td class="code">${esc(c.code)}</td>
    <td>${esc(c.label || "–")}</td>
    <td>${c.devices.length}/${c.max || 2}</td>
    <td><span class="pill ${c.active ? "" : "off"}">${c.active ? "Aktif" : "Nonaktif"}</span></td>
    <td class="muted">${new Date(c.created).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "2-digit" })}</td>
    <td><div class="acts">
      <button class="ghost sm" data-copy="${esc(c.code)}" data-label="${esc(c.label || "")}">Salin pesan</button>
      <button class="ghost sm" data-act="reset" data-code="${esc(c.code)}" title="Kosongkan daftar HP, misalnya pembeli ganti HP">Reset HP</button>
      <button class="ghost sm" data-act="${c.active ? "disable" : "enable"}" data-code="${esc(c.code)}">${c.active ? "Nonaktifkan" : "Aktifkan"}</button>
    </div></td></tr>`).join("") || `<tr><td colspan="6" class="muted">Belum ada kode.</td></tr>`;
}

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault(); KEY = $("#key").value.trim();
  try { await load(); try { sessionStorage.setItem("lk-admin", KEY); } catch (_) {} $("#login").hidden = true; $("#main").hidden = false; }
  catch (err) { $("#login-msg").textContent = err.message; }
});
$("#make-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const label = $("#label").value.trim();
  try {
    const d = await api("POST", { action: "create", label, count: $("#count").value, max: $("#max").value });
    $("#made").innerHTML = d.created.map((c) => `<div><pre>${esc(waText(c, label))}</pre><button class="sm" data-copy="${esc(c)}" data-label="${esc(label)}" style="margin-top:6px">Salin pesan untuk ${esc(c)}</button></div>`).join("");
    $("#label").value = ""; await load();
  } catch (err) { $("#made").innerHTML = `<p class="msg">${esc(err.message)}</p>`; }
});
$("#q").addEventListener("input", draw);
$("#reload").addEventListener("click", load);
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) return copy(waText(b.dataset.copy, b.dataset.label), b);
  if (b.dataset.act) { b.disabled = true; try { await api("POST", { action: b.dataset.act, code: b.dataset.code }); await load(); } catch (err) { alert(err.message); } }
});
async function loadCfg() {
  const r = await fetch("/api/admin/config", { headers: { "x-admin-key": KEY } });
  const c = await r.json();
  $("#sc-url").value = c.webhookUrl; $("#sc-claim").textContent = location.origin + "/klaim";
  $("#sc-variants").value = (c.variants || []).join("\n");
  const when = (x) => new Date(x).toLocaleString("id-ID");
  let t = c.lastTest ? ` Tes terakhir dari Scalev: ${when(c.lastTest.at)} (${c.lastTest.signed_ok ? "tanda tangan cocok ✓" : c.lastTest.has_sig === false ? "tanpa tanda tangan" : "tanda tangan TIDAK cocok: cek lagi Signing Secret-nya"}).` : " Belum ada tes dari Scalev.";
  if (c.lastBad && (!c.lastTest || !c.lastTest.signed_ok || c.lastBad.at > c.lastTest.at)) t += ` Ditolak ${when(c.lastBad.at)}: event ${c.lastBad.event} dengan tanda tangan tidak cocok.`;
  $("#sc-status").innerHTML = (c.hasSecret ? '<span class="pill">Signing Secret tersimpan</span>' : '<span class="pill off">Signing Secret belum diisi</span>') + esc(t);
}
$("#sc-copy").addEventListener("click", (e) => copy($("#sc-url").value, e.target));
$("#sc-form").addEventListener("submit", async (e) => { e.preventDefault(); const v = $("#sc-secret").value.trim(); if (!v) return; await fetch("/api/admin/config", { method: "POST", headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: JSON.stringify({ secret: v }) }); $("#sc-secret").value = ""; loadCfg(); });
$("#sc-var-form").addEventListener("submit", async (e) => { e.preventDefault(); await fetch("/api/admin/config", { method: "POST", headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: JSON.stringify({ variants: $("#sc-variants").value.split(/\s+/).filter(Boolean) }) }); loadCfg(); });
const _load = load; load = async () => { await _load(); loadCfg().catch(() => {}); };
if (KEY) load().then(() => { $("#login").hidden = true; $("#main").hidden = false; }).catch(() => {});
</script>
</body>
</html>
