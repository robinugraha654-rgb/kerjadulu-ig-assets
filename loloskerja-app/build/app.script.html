/* ================= LATIHAN: tes koran ================= */
// Kraepelin-style: several lanes (lajur), each with its own time limit. Sum each pair going up, write the last digit.
const KMODES = {
  sprint: { lanes: 4, sec: 15, label: "Sprint 1 menit", sub: "4 lajur × 15 detik. Pemanasan cepat." },
  tahan: { lanes: 10, sec: 30, label: "Ketahanan 5 menit", sub: "10 lajur × 30 detik. Mirip tes asli." },

const pad2 = (n) => String(n).padStart(2, "0");
const X_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const UP_ICON = `<svg class="kup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;

function koranStart(mode) {
  const m = KMODES[mode] || KMODES.sprint;
  K = { mode, lanes: m.lanes, sec: m.sec, lane: 0, nums: laneNums(), pos: 0, right: 0, wrong: 0,
    laneRight: Array(m.lanes).fill(0), laneWrong: Array(m.lanes).fill(0), laneEnd: Date.now() + m.sec * 1000, timer: null,
    combo: 0, maxCombo: 0, trail: [], start: Date.now(), lastAt: 0 };
  K.timer = setInterval(koranTick, 200);
  render(); window.scrollTo(0, 0);
}
function koranTick() {
  if (!K || K.done) return;
  if (Date.now() >= K.laneEnd) {
    if (K.lane + 1 >= K.lanes) { koranFinish(); return; }
    nextLane();
  }
  paintKoran();
}
function nextLane() {
  K.lane++; K.nums = laneNums(); K.pos = 0; K.laneEnd = Date.now() + K.sec * 1000;
  const wrap = document.getElementById("kstrip-wrap");
  if (wrap) { wrap.innerHTML = stripHTML(); wrap.classList.remove("lane-in"); void wrap.offsetWidth; wrap.classList.add("lane-in"); }
  const fl = document.getElementById("kflash");
  if (fl) { fl.textContent = `Lajur ${K.lane + 1}: mulai lagi dari bawah`; fl.classList.remove("show"); void fl.offsetWidth; fl.classList.add("show"); }
  const sub = document.getElementById("ksub"); if (sub) sub.textContent = `Lajur ${K.lane + 1} dari ${K.lanes}`;
}
function koranFinish() {
  if (!K || K.done) return;
  clearInterval(K.timer);
  const total = K.right + K.wrong, prev = bestKoran();
  const elapsedSec = K.lane * K.sec + (K.sec - Math.max(0, (K.laneEnd - Date.now()) / 1000));
  const minutes = Math.max(elapsedSec, 15) / 60;
  const lanes = K.laneRight.map((r, i) => r + K.laneWrong[i]).slice(0, K.lane + 1);
  const rec = { at: Date.now(), speed: Math.round(total / minutes), acc: total ? Math.round((K.right / total) * 100) : 0, right: K.right, wrong: K.wrong, lanes, mode: K.mode, maxCombo: K.maxCombo };
  const isBest = total > 0 && (!prev || rec.speed > prev.speed);
  S.koran.push(rec); S.koran = S.koran.slice(-20); save();
  K = { done: rec, isBest };
  render();
}
function koranKey(d) {
  if (!K || K.done) return;
  const ok = d === (K.nums[K.pos] + K.nums[K.pos + 1]) % 10;
  if (ok) { K.right++; K.laneRight[K.lane]++; } else { K.wrong++; K.laneWrong[K.lane]++; }
  const broke = !ok && K.combo >= 3;
  K.combo = ok ? K.combo + 1 : 0; K.maxCombo = Math.max(K.maxCombo, K.combo);
  K.trail.push(ok); if (K.trail.length > 10) K.trail.shift(); K.lastAt = Date.now();

    const a = document.createElement("span");

    strip.appendChild(a);

  if (K.pos > K.nums.length - 12) {

    if (!el) return;
    el.classList.remove(p + "ok", p + "bad"); void el.offsetWidth; el.classList.add(p + (ok ? "ok" : "bad"));
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove(p + "ok", p + "bad"), 220);
  });

}
const rowHTML = (n, i) => `<span class="kn${i === K.pos || i === K.pos + 1 ? " act" : ""}" data-i="${i}" style="bottom:${i * RH}px"><i>${n}</i></span>`;
const stripHTML = () => `<div class="kstrip" id="kstrip" style="transform:translateY(${K.pos * RH}px)">${K.nums.map(rowHTML).join("")}</div>`;

}

  }
  return `${topBar(`<h1 class="ptitle">Panduan</h1>`)}
    <p class="muted">Lima modul, urut dari persiapan sampai hari-H. Baca berurutan, atau langsung ke bagian yang paling kamu butuhkan minggu ini.</p>
    <section class="card" style="padding-block:4px"><div class="list">
      ${KIT.guides.map((g) => `<button class="lrow" data-guide="${g.id}"><span class="num">${g.no}</span><span class="lmeta"><b>${esc(g.title)}</b><span class="muted small">${esc(g.sub)}</span></span><span class="go">→</span></button>`).join("")}
    </div></section>
    <section class="card"><span class="eyebrow">Bonus</span><div class="list">
      <button class="lrow" data-guide="berkas"><span class="num">✓</span><span class="lmeta"><b>Checklist Dokumen Lamaran</b><span class="muted small">${S.docs.length}/${docCount} berkas sudah dicentang</span></span><span class="go">→</span></button>
      <button class="lrow" data-guide="kamus"><span class="num">Aa</span><span class="lmeta"><b>Kamus Istilah Kontrak Kerja</b><span class="muted small">16 istilah, bisa dicari</span></span><span class="go">→</span></button>
    </div></section>`;
}

/* ================= LAMARAN ================= */
let jobForm = false;
function viewLamaran() {
  const counts = STAGES.map((_, i) => S.jobs.filter((j) => j.stage === i).length);
  return `${topBar(`<h1 class="ptitle">Lamaran saya</h1>`)}
    <section class="pipe" aria-label="Ringkasan lamaran">${STAGES.map((s, i) => `<div style="--c:${STAGE_C[i]}">${num(counts[i], 0)}<span>${s}</span></div>`).join("")}</section>
    <section class="card">
      <div><span class="eyebrow">Tracker lamaran</span><h2 style="margin-top:4px">Catat semua, biar nggak ada yang terlewat.</h2><p class="muted small" style="margin-top:6px">Target: sekitar 10 lamaran per minggu. Follow-up sekali setelah 5 sampai 7 hari kerja tanpa kabar.</p></div>
      ${jobForm ? `<form class="form" id="job-form">
          <label for="job-co">Nama perusahaan<input id="job-co" required placeholder="PT ..." autocomplete="organization"></label>
          <div class="two"><label for="job-pos">Posisi<input id="job-pos" placeholder="Operator produksi"></label><label for="job-date">Tanggal kirim<input id="job-date" type="date" value="${new Date().toISOString().slice(0, 10)}"></label></div>
          <div class="row"><button class="btn sm" type="submit">Simpan lamaran</button><button class="btn sm ghost" type="button" data-job-cancel>Batal</button></div>
        </form>` : `<button class="btn" data-job-new>+ Tambah lamaran</button>`}
      <div>${S.jobs.length ? S.jobs.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((j) => {
        const days = j.date ? Math.floor((Date.now() - new Date(j.date + "T00:00").getTime()) / 864e5) : 0;
        const fu = j.stage === 0 && days >= 7;
        return `
        <div class="job" data-jobcard="${j.id}">
          <div class="row between" style="align-items:flex-start"><div style="min-width:0"><h3>${esc(j.co)}</h3><p class="muted small">${esc(j.pos || "Posisi belum diisi")} · ${j.date ? new Date(j.date + "T00:00").toLocaleDateString("id-ID", { day: "numeric", month: "short" }) : "–"}</p></div>${j.example ? `<span class="chip">Contoh</span>` : fu ? `<span class="chip or">Waktunya follow-up</span>` : ""}</div>
          <div class="steps" role="group" aria-label="Status ${esc(j.co)}">${STAGES.map((s, i) => `<button class="${i === 3 ? "st-yes" : i === 4 ? "st-no" : ""}" data-job="${j.id}" data-stage="${i}" aria-pressed="${j.stage === i}">${s}</button>`).join("")}</div>
          <button class="linkbtn" data-job-del="${j.id}" style="align-self:flex-start">Hapus</button>
        </div>`; }).join("") : `<p class="muted" style="padding-top:8px">Belum ada lamaran. Tambahkan yang pertama setelah kirim berkas.</p>`}</div>
    </section>
    <p class="muted small">Data lamaran dan latihan tersimpan di HP ini saja.</p>`;
}

/* ================= router + render ================= */
const VIEWS = { beranda: viewBeranda, latihan: viewLatihan, interview: viewInterview, panduan: viewPanduan, lamaran: viewLamaran };
const TABS = Object.keys(VIEWS);
const current = () => (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "beranda");
const screenKey = (v) => [v, v === "latihan" && Q ? `${Q.set}${Q.mode}${Q.done ? 1 : 0}` : "", v === "latihan" && K ? (K.done ? "kd" + K.done.at : "kr") : "", v === "panduan" ? G || "" : "", v === "interview" ? IV.sec : ""].join("|");
function render(o = {}) {
  const v = current(), key = screenKey(v);
  ENTER = key !== lastKey; lastKey = key;
  app.classList.remove("enter");
  app.innerHTML = VIEWS[v]();
  if (ENTER && !REDUCE) { [...app.children].forEach((c, i) => c.style.setProperty("--i", Math.min(i, 8))); void app.offsetWidth; app.classList.add("enter"); }
  if (o.just) app.querySelectorAll(o.just).forEach((el) => el.classList.add("just"));
  if (o.slide && !ENTER && !REDUCE) { const c = app.querySelector("[data-slide]"); if (c) c.classList.add(o.slide > 0 ? "slide-next" : "slide-prev"); }
  justPick = false;
  app.querySelectorAll("[data-count]").forEach(countUp);
  app.querySelectorAll(".needle").forEach((n) => requestAnimationFrame(() => requestAnimationFrame(() => { n.style.transform = `rotate(${n.dataset.to}deg)`; })));
  if (v !== lastTab) {
    lastTab = v;
    document.querySelectorAll("[data-tab]").forEach((a) => (a.dataset.tab === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    document.querySelector(".tabs nav").style.setProperty("--t", TABS.indexOf(v));
  }
  document.body.classList.toggle("focus", v === "latihan" && !!K && !K.done);
  if (v === "latihan") { paintKoran(); paintQuizTimer(); }
  if (v === "latihan" && ENTER && K && K.done && K.isBest) setTimeout(() => burst(document.getElementById("koran-card")), REDUCE ? 0 : 450);
  readProgress();
}
function readProgress() {
  const bar = app.querySelector(".readbar i"); if (!bar) return;
  const doc = app.querySelector(".doc"); if (!doc) return;
  const r = doc.getBoundingClientRect(), total = r.height - innerHeight * 0.6;
  bar.style.setProperty("--p", Math.max(0, Math.min(1, total > 0 ? -r.top / total : 1)).toFixed(3));
}
window.addEventListener("scroll", readProgress, { passive: true });
window.addEventListener("hashchange", () => {
  if (K && !K.done && current() !== "latihan") { clearInterval(K.timer); K = null; }
  render(); window.scrollTo(0, 0);
});

/* ================= events ================= */
app.addEventListener("click", (e) => {
  const t = e.target.closest("button, a[data-jump], a[data-guide-link]"); if (!t) return;
  const d = t.dataset;
  if (d.jump) { e.preventDefault(); const el = document.getElementById(d.jump); if (el) el.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth" }); return; }
  if (d.guideLink) { G = d.guideLink; return; }
  if (d.plan != null) { toggle(S.plan, +d.plan); save(); render({ just: `[data-plan="${d.plan}"], #plan-chip` }); }
  else if (d.doc != null) { toggle(S.docs, +d.doc); save(); render({ just: `[data-doc="${d.doc}"], .chip.or` }); }
  else if (d.sign != null) { toggle(S.sign, +d.sign); save(); render({ just: `[data-sign="${d.sign}"]` }); }
  else if (d.key != null) koranKey(+d.key);
  else if ("koranStart" in d) koranStart(d.koranStart);
  else if ("koranStop" in d) koranFinish();
  else if (d.setopen != null) { pickSet = pickSet === +d.setopen ? null : +d.setopen; render(); }
  else if (d.qstart != null) quizStart(+d.qstart, d.qmode);
  else if (d.pick != null) { Q.picks[Q.order[Q.i]] = +d.pick; justPick = true; render(); }
  else if (d.qnav) { const dir = +d.qnav; Q.i = Math.max(0, Math.min(Q.order.length - 1, Q.i + dir)); render({ slide: dir }); window.scrollTo(0, 0); }
  else if ("qfinish" in d) quizFinish();
  else if ("quit" in d) { if (Q) clearInterval(Q.timer); Q = null; render(); }
  else if (d.ivsec) { IV = { sec: d.ivsec, i: 0, open: false }; render(); }
  else if ("ivopen" in d) { IV.open = true; render({ just: ".ans" }); }
  else if (d.ivnav) { const dir = +d.ivnav; IV.i += dir; IV.open = false; render({ slide: dir }); }
  else if (d.ivready) { toggle(S.ready, +d.ivready); save(); render({ just: ".readybtn" }); if (S.ready.includes(+d.ivready)) toast(`Jawaban siap: ${S.ready.length}/40`); }
  else if (d.guide != null) { G = d.guide || null; render(); window.scrollTo(0, 0); }
  else if ("copy" in d) {
    const pre = t.previousElementSibling, txt = pre.textContent;
    const done = () => { t.textContent = "Tersalin ✓"; toast("Teks tersalin"); setTimeout(() => { t.textContent = "Salin teks"; }, 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Teks dipilih, tekan salin"; };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
  }
  else if ("resetAsk" in d) { resetUI = `<div class="confirm"><span>Kosongkan semua centang berkas?</span><button class="btn sm" data-reset-yes>Ya, kosongkan</button><button class="btn sm ghost" data-reset-no>Batal</button></div>`; render(); }
  else if ("resetYes" in d) { S.docs = []; save(); resetUI = `<button class="linkbtn" data-reset-ask>Kosongkan centang</button>`; render(); toast("Centang berkas dikosongkan"); }
  else if ("resetNo" in d) { resetUI = `<button class="linkbtn" data-reset-ask>Kosongkan centang</button>`; render(); }
  else if ("jobNew" in d) { jobForm = true; render(); const f = document.getElementById("job-co"); if (f) f.focus(); }
  else if ("jobCancel" in d) { jobForm = false; render(); }
  else if (d.job) { const j = S.jobs.find((x) => x.id === +d.job); if (j) { j.stage = +d.stage; save(); render({ just: `[data-job="${d.job}"][data-stage="${d.stage}"]` }); if (j.stage === 3) { toast("Selamat, diterima!"); burst(app.querySelector(`[data-jobcard="${d.job}"]`)); } } }
  else if (d.jobDel) { S.jobs = S.jobs.filter((x) => x.id !== +d.jobDel); save(); render(); toast("Lamaran dihapus"); }
});
app.addEventListener("submit", (e) => {
  if (e.target.id !== "job-form") return;
  e.preventDefault();
  const co = document.getElementById("job-co").value.trim(); if (!co) return;
  const id = Date.now();
  S.jobs.push({ id, co, pos: document.getElementById("job-pos").value.trim(), date: document.getElementById("job-date").value, stage: 0 });
  jobForm = false; save(); render({ just: `[data-jobcard="${id}"]` }); toast("Lamaran disimpan");
});
app.addEventListener("input", (e) => {
  if (e.target.id !== "kamus-q") return;
  kamusQ = e.target.value;
  document.getElementById("kamus-list").innerHTML = termList();
});
document.addEventListener("keydown", (e) => { if (K && !K.done && /^[0-9]$/.test(e.key)) koranKey(+e.key); });

render();
</script>
