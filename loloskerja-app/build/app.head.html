<title>LolosKerja App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Caveat:wght@600;700&display=swap">
<style>
  /* Layout: phone-first app shell (max 520px), floating pill tab bar, rounded cards. Look: LolosKerja on black with a red accent, white "sticker" highlights, a paper test sheet for tes koran. Deliberately dark-only. */
  :root {
    --bg: #0B0B0C; --surface: #17171A; --surface2: #222226; --line: #2E2E33; --fg: #F5F5F6; --mute: #A3A3AB;
    --or: #FF3B47; --or2: #FF6B74; --or-ink: #1A0204; --or-soft: rgba(255,59,71,.15); --ok: #3DDC97; --bad: #9A9AA3;
    --q: #F4F4F5; --q-ink: #0B0B0C;
    --paper: #F2EBDD; --paper-ink: #1B150F; --paper-line: #DCCFB8; --pencil: #3A4A63; --hz-dark: #1A0204;
    --shadow: 0 18px 40px rgba(0,0,0,.55); --glow: rgba(255,59,71,.13);
    --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
    --body: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
    --spring: cubic-bezier(.3,1.35,.5,1); --out: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .glow { position: fixed; inset: -20vh -30vw auto; height: 70vh; pointer-events: none; z-index: 0; background: radial-gradient(closest-side, var(--glow), transparent 70%); animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate3d(-8%, -6%, 0) scale(1); } to { transform: translate3d(10%, 4%, 0) scale(1.15); } }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-stretch: 78%; margin: 0; letter-spacing: -.01em; line-height: 1.02; text-wrap: balance; font-weight: 850; }
  h2 { font-size: 23px; }
  p { margin: 0; }
  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(116px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
  .muted { color: var(--mute); }
  .small { font-size: 13px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { display: inline-flex; align-items: center; gap: 7px; font: 800 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--or); }

  /* entrance + motion system */
  .app.enter > * { animation: rise .55s var(--out) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .slide-next { animation: slideN .38s var(--out) both; }
  .slide-prev { animation: slideP .38s var(--out) both; }
  @keyframes slideN { from { opacity: 0; transform: translateX(28px); } }
  @keyframes slideP { from { opacity: 0; transform: translateX(-28px); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes press { 0% { transform: scale(1); } 40% { transform: scale(.97); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  @keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-6px); } }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 900 16px var(--display); font-stretch: 85%; letter-spacing: .06em; }
  .brand .tag { background: var(--or); color: var(--or-ink); padding: 5px 8px 4px; border-radius: 5px; line-height: 1; transform: skewX(-8deg); display: inline-block; }
  .proto { font: 700 10.5px var(--mono); letter-spacing: .06em; color: var(--mute); border: 1px dashed var(--line); border-radius: 999px; padding: 4px 10px; text-transform: uppercase; }
  .ptitle { font-size: 34px; }

  .card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px 18px; font: 800 15px var(--body); background: var(--or); color: var(--or-ink); cursor: pointer; text-decoration: none; transition: transform .18s var(--spring), filter .18s, box-shadow .2s; box-shadow: 0 6px 18px -6px var(--or); }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: var(--surface2); color: var(--fg); box-shadow: none; }
  .btn.sm { padding: 10px 14px; font-size: 13.5px; border-radius: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn .arr { transition: transform .2s var(--spring); }
  .btn:hover .arr { transform: translateX(3px); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--body); padding: 5px 10px; border-radius: 999px; background: var(--surface2); color: var(--mute); white-space: nowrap; }
  .chip.or { background: var(--or-soft); color: var(--or); }
  .chip.just { animation: pop .4s var(--spring); }
  .bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--or), var(--or2)); border-radius: 99px; transition: width .6s var(--out); }
  .app.enter .bar > i { animation: grow .9s var(--out) both .2s; }
  @keyframes grow { from { width: 0; } }

  /* checkbox tick */
  .tick { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); transition: background .2s, border-color .2s; }
  .tick svg { width: 16px; height: 16px; fill: none; stroke: var(--or-ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
  .done .tick { background: var(--or); border-color: var(--or); }
  .done .tick svg { stroke-dashoffset: 0; }
  .just.done .tick { animation: pop .42s var(--spring); }
  .just.done .tick svg { animation: draw .35s .08s var(--out) both; }

  /* hazard tape */
  .hz { height: 8px; margin: -18px -18px 0; background: repeating-linear-gradient(-45deg, var(--or) 0 10px, var(--hz-dark) 10px 20px); background-size: 28.28px 100%; animation: tape 1.6s linear infinite; }
  @keyframes tape { to { background-position: 28.28px 0; } }

  /* ===== beranda ===== */
  .hello { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
  .hello h1 { font-size: clamp(40px, 12vw, 52px); font-weight: 900; font-stretch: 72%; line-height: .95; letter-spacing: -.015em; }
  .hl { color: var(--or); background: none; position: relative; white-space: nowrap; }
  .hl::after { content: ""; position: absolute; left: -2px; right: -4px; bottom: .04em; height: .22em; background: var(--or-soft); border-radius: 3px; z-index: -1; transform-origin: left; }
  .app.enter .hl::after { animation: sweep .7s .45s var(--out) both; }
  @keyframes sweep { from { transform: scaleX(0); } }
  .idhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ready { display: grid; grid-template-columns: 136px 1fr; gap: 16px; align-items: center; }
  .ready h2 { font-size: 24px; }
  .gauge { position: relative; width: 136px; height: 136px; }
  .gauge svg { width: 100%; height: 100%; overflow: visible; }
  .tk { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
  .tk.on { stroke: var(--or); }
  .tk.new { animation: tkOn .35s both; animation-delay: calc(var(--k) * 22ms + 150ms); }
  @keyframes tkOn { from { stroke: var(--line); } 50% { stroke: var(--or2); stroke-width: 5; } to { stroke: var(--or); } }
  .needle { transform-box: view-box; transform-origin: 60px 60px; transition: transform 1.3s cubic-bezier(.34,1.45,.45,1) .15s; }
  .needle line { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
  .needle circle { fill: var(--or); stroke: var(--surface); stroke-width: 2; }
  .gread { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; line-height: 1; }
  .gread b { font: 800 30px var(--mono); letter-spacing: -.04em; }
  .gread span { display: block; font: 700 10px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: 3px; }
  .stamp { position: absolute; right: 14px; top: 26px; font: 900 15px var(--display); font-stretch: 80%; letter-spacing: .12em; text-transform: uppercase; color: var(--ok); border: 2.5px solid var(--ok); border-radius: 8px; padding: 4px 10px; transform: rotate(-9deg); opacity: .85; mix-blend-mode: normal; }
  .app.enter .stamp { animation: stamp .55s 1s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-20deg) scale(2.2); } to { opacity: .85; transform: rotate(-9deg) scale(1); } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface2); border-radius: 14px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .stat b { font: 800 22px var(--mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--mute); line-height: 1.3; }
  .plan { display: flex; flex-direction: column; }
  .day { position: relative; display: grid; grid-template-columns: 26px 1fr auto; gap: 14px; align-items: start; padding: 11px 0; background: none; border: 0; text-align: left; width: 100%; cursor: pointer; }
  .day:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 41px; bottom: -7px; width: 2px; border-radius: 2px; background: var(--line); }
  .day.done:not(:last-child)::after { background: var(--or); }
  .dbody { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .dt { font-weight: 800; }
  .done .dt { color: var(--mute); text-decoration: line-through; text-decoration-color: var(--or); text-decoration-thickness: 2px; }
  .day.next .tick { border-color: var(--or); animation: ping 2s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--or-soft); } 70% { box-shadow: 0 0 0 9px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
  .nextchip { font: 800 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--or); }
  .dmin { font: 700 12px var(--mono); color: var(--mute); white-space: nowrap; padding-top: 3px; }
  .cta-koran { background: var(--or); color: var(--or-ink); border: 0; }
  .cta-koran .hz { background: repeating-linear-gradient(-45deg, var(--hz-dark) 0 10px, transparent 10px 20px); background-size: 28.28px 100%; opacity: .9; }
  .cta-koran h2 { font-size: 30px; font-stretch: 72%; }
  .cta-koran .eyebrow { color: var(--or-ink); opacity: .7; }
  .cta-koran .wm { position: absolute; right: -6px; bottom: -18px; font: 800 110px/1 var(--mono); letter-spacing: -.08em; opacity: .13; pointer-events: none; }
  .cta-koran .btn { background: var(--or-ink); color: var(--or); align-self: flex-start; box-shadow: none; }

  /* ===== latihan ===== */
  .list { display: flex; flex-direction: column; }
  .lrow { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; color: inherit; text-decoration: none; transition: transform .2s var(--out); }
  .list > .lrow:first-child { border-top: 0; }
  .lrow:active { transform: scale(.985); }
  .lrow .num { width: 44px; height: 44px; border-radius: 13px; background: var(--or-soft); color: var(--or); display: grid; place-items: center; font: 800 17px var(--mono); transition: transform .25s var(--spring), background .2s, color .2s; }
  .lrow:hover .num, .lrow[aria-expanded="true"] .num { background: var(--or); color: var(--or-ink); transform: rotate(-6deg); }
  .lrow b { display: block; font-size: 16px; }
  .lrow .go { color: var(--mute); font-weight: 900; transition: transform .2s var(--spring), color .2s; }
  .lrow:hover .go { transform: translateX(4px); color: var(--or); }
  .lmeta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .score { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font: 800 13px var(--mono); color: var(--or); white-space: nowrap; }
  .mini { width: 46px; height: 4px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--or); }
  .modepick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; animation: fadeDown .3s var(--out) both; }
  .mode { border: 2px solid var(--line); background: var(--surface2); border-radius: 16px; padding: 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .2s, transform .2s var(--spring); }
  .mode:hover { border-color: var(--or); transform: translateY(-2px); }
  .mode b { font: 850 18px var(--display); font-stretch: 80%; }
  .mode span { font-size: 12.5px; color: var(--mute); line-height: 1.4; }
  .setintro { font-size: 13px; color: var(--mute); padding-bottom: 14px; animation: fadeDown .3s .05s var(--out) both; }

  /* tes koran: focus mode with lanes (lajur) on a paper strip */
  .tabs { transition: transform .45s var(--out); }
  body.focus .tabs { transform: translateY(140%); }
  body.focus .app { padding-bottom: 14px; }
  .kf { display: flex; flex-direction: column; gap: 12px; min-height: calc(100vh - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: calc(100dvh - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  .kf-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .kx { width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: transform .2s var(--spring); }
  .kx:active { transform: scale(.9); }
  .kx svg { width: 18px; height: 18px; }
  .kf-title { min-width: 0; line-height: 1.2; }
  .kf-title b { display: block; font: 850 23px/1 var(--display); font-stretch: 78%; }
  .kf-title span { font-size: 12.5px; color: var(--mute); font-weight: 600; }
  .timer { font: 800 30px var(--mono); letter-spacing: -.04em; font-variant-numeric: tabular-nums; transition: color .3s; }
  .timer.urgent { color: var(--bad); animation: throb 1s ease-in-out infinite; }
  @keyframes throb { 50% { transform: scale(1.08); } }
  .ksegs { display: flex; gap: 4px; }
  .ksegs i { flex: 1; height: 5px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
  .ksegs b { display: block; height: 100%; width: 0; background: var(--or); }
  .ksegs.urgent i.cur b { background: var(--bad); }
  .kview { position: relative; flex: 1; min-height: 230px; border-radius: 22px; overflow: hidden; background: var(--surface) radial-gradient(circle at 50% 50%, var(--or-soft), transparent 65%); border: 1px solid var(--line); }
  .kpaper { position: absolute; top: 0; bottom: 0; left: 50%; width: min(220px, 74%); transform: translateX(-50%); background: var(--paper); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 40px -20px rgba(0,0,0,.6); -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent); mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent); overflow: hidden; }
  .kstrip-wrap { position: absolute; inset: 0; }
  .lane-in { animation: laneIn .5s var(--out) both; }
  @keyframes laneIn { from { opacity: 0; transform: translateX(80px); } }
  .kstrip { position: absolute; left: 0; right: 0; bottom: calc(50% - 56px); height: 0; transition: transform .3s var(--out); }
  .kn { position: absolute; left: 0; right: 0; height: 56px; border-bottom: 1px solid var(--paper-line); display: flex; align-items: center; }
  .kn i { display: block; width: 72px; margin-left: 16px; text-align: center; font: 700 32px/1 var(--mono); font-style: normal; color: var(--paper-ink); }
  .kans { position: absolute; left: 104px; height: 56px; line-height: 56px; font: 700 36px var(--hand); color: var(--pencil); animation: write .3s var(--out) both; }
  .kans.bad { color: #C2362F; text-decoration: line-through; text-decoration-thickness: 2px; }
  @keyframes write { from { opacity: 0; transform: translate(-8px, 6px) rotate(-14deg) scale(.6); } }
  .kframe { position: absolute; left: 12px; width: 80px; bottom: calc(50% - 58px); height: 116px; border: 3px solid var(--or); border-radius: 18px; background: rgba(255,122,28,.10); box-shadow: 0 0 0 6px rgba(255,122,28,.14); transition: border-color .15s, box-shadow .15s; }
  .kframe.ok { border-color: #12985A; box-shadow: 0 0 0 8px rgba(18,152,90,.2); }
  .kframe.bad { border-color: #C2362F; box-shadow: 0 0 0 8px rgba(194,54,47,.2); animation: shake .3s; }
  .kcaret { position: absolute; left: 106px; bottom: calc(50% - 2px); width: 32px; height: 4px; border-radius: 3px; background: var(--or); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .kup { position: absolute; left: 156px; bottom: calc(50% - 11px); width: 22px; height: 22px; color: #9A8A70; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .kflash { position: absolute; left: 50%; top: 14px; z-index: 3; transform: translateX(-50%); background: var(--fg); color: var(--bg); font: 800 13px var(--body); padding: 7px 14px; border-radius: 99px; white-space: nowrap; opacity: 0; pointer-events: none; }
  .kflash.show { animation: pill 1.6s var(--out) both; }
  @keyframes pill { 0% { opacity: 0; transform: translate(-50%, -10px); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
  .khint { position: absolute; left: 50%; bottom: 12px; z-index: 3; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); text-align: center; font-size: 12px; color: var(--fg); font-weight: 700; background: var(--surface); border: 1px solid var(--line); padding: 7px 12px; border-radius: 99px; box-shadow: var(--shadow); transition: opacity .3s, transform .3s; }
  .khint.gone { opacity: 0; transform: translate(-50%, 8px); }
  .kcount { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); font-weight: 600; padding-inline: 4px; }
  .kcount b { font: 800 17px var(--mono); color: var(--fg); margin-left: 4px; }
  .kcount b.bad { color: var(--bad); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key { position: relative; border: 0; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font: 800 26px var(--mono); padding: 13px 0; cursor: pointer; touch-action: manipulation; box-shadow: inset 0 -3px 0 var(--line); transition: transform .08s, background .15s, color .15s; }
  .key.zero { grid-column: 2; }
  .key:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--line); }
  .key.hit-ok { background: var(--ok); color: #04140c; border-color: var(--ok); }
  .key.hit-bad { background: var(--bad); color: #1a0505; border-color: var(--bad); }
  .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kchart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 18px; border-bottom: 1px solid var(--line); }
  .kbar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
  .kbar i { display: block; width: 100%; max-width: 34px; height: var(--h); min-height: 3px; border-radius: 7px 7px 2px 2px; background: linear-gradient(var(--or2), var(--or)); transform-origin: bottom; }
  .kbar b { font: 800 11.5px var(--mono); color: var(--fg); }
  .app.enter .kbar i { animation: barUp .7s var(--spring) both; animation-delay: calc(var(--n) * 70ms + 250ms); }
  @keyframes barUp { from { transform: scaleY(0); } }
  .kaxis { display: flex; gap: 6px; margin-top: 5px; }
  .kaxis span { flex: 1; text-align: center; font: 700 10px var(--mono); color: var(--mute); }
  .kmodes .mode b { font-size: 19px; }
  .linkbtn { border: 0; background: none; color: var(--mute); font-size: 12.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
  /* quiz */
  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--mute); font-weight: 700; padding: 0; cursor: pointer; font-size: 14px; align-self: flex-start; transition: color .2s; }
  .back:hover { color: var(--fg); }
  .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  /* tab bar */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }

  @media (max-width: 380px) { .ready { grid-template-columns: 116px 1fr; } .gauge { width: 116px; height: 116px; } .stats .stat b { font-size: 19px; } }

  /* ===== LolosKerja · Hitam & Merah (rounded, friendly) ===== */
  h1, h2, h3 { font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }

  @keyframes stick { from { opacity: 0; transform: rotate(-14deg) scale(1.8); } to { opacity: 1; transform: rotate(6deg) scale(1); } }
  .trend-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }

  @keyframes trPulse { from { transform: scale(.7); opacity: .55; } to { transform: scale(2.6); opacity: 0; } }

  /* tes koran: game layer on the paper column */

  .kcombo.hot b { color: var(--or); text-shadow: 0 0 22px rgba(255,59,71,.6); }
